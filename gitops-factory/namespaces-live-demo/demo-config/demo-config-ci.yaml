apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-config-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-config-ci-writer
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-config-ci-writer-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: demo-config-ci-writer
subjects:
  - kind: ServiceAccount
    name: demo-config-ci
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config-shared-settings
data:
  ENVIRONMENT: "demo"
  LOG_LEVEL: "info"
